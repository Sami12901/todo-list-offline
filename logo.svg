  <!-- Checkmark -->
  <path d="M33 44 L38 49 L49 38" fill="none" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- First Bar -->
  <rect x="56" y="44" width="18" height="4" rx="2" fill="#94A3B8"/>
  <!-- Checkbox 2 -->
  <rect x="34" y="58" width="11" height="11" rx="2.5" fill="none" stroke="#EF4444" stroke-width="2.5"/>
  <!-- Bar 2 -->
  <rect x="56" y="62" width="18" height="4" rx="2" fill="#334155"/>
  <!-- Amber Accent Dot -->
  <circle cx="70" cy="30" r="2.5" fill="#F59E0B"/>
